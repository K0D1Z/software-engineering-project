services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:${POSTGRES_PORT}:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql"
volumes:
  pgdata: